{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between align-items-end mb-4"><div><p class="eyebrow mb-1">Note details</p><h1 class="h2 mb-0">{% if note %}{{note.title or 'Untitled note'}}{% else %}New note{% endif %}</h1></div>{% if note %}<a class="btn btn-outline-secondary" href="/notes">Back to notes</a>{% endif %}</div><section class="page-card"><form method="post" class="row g-3"><div class="col-12"><label class="form-label">Title</label><input class="form-control" name="title" value="{{note.title if note else ''}}"></div><div class="col-12"><label class="form-label">Content</label><textarea class="form-control" name="content" rows="7" required>{{note.content if note else ''}}</textarea></div><div class="col-md-4"><label class="form-label">Kind</label><select class="form-select" name="kind">{% for v in ['general','preparation','follow_up'] %}<option value="{{v}}" {% if note and note.kind==v %}selected{% endif %}>{{v|replace('_',' ')|title}}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Meeting</label><select class="form-select" name="commitment_id"><option value="">None</option>{% for x in commitments %}<option value="{{x.id}}" {% if note and note.commitment_id==x.id %}selected{% endif %}>{{x.title}}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Tasks</label><select class="form-select" multiple name="task_ids">{% for x in tasks %}<option value="{{x.id}}" {% if note and x in note.tasks %}selected{% endif %}>{{x.title}}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Contacts</label><select class="form-select" multiple name="contact_ids">{% for x in contacts %}<option value="{{x.id}}" {% if note and x in note.contacts %}selected{% endif %}>{{x.name}}</option>{% endfor %}</select></div><div><button class="btn btn-primary">Save note</button></div></form></section>{% endblock %}
