{% extends 'base.html' %}{% block content %}<h1>{% if note %}Edit{% else %}New{% endif %} note</h1><form method="post"><label>Title<input name="title" value="{{note.title if note else ''}}"></label><label>Content<textarea name="content" required>{{note.content if note else ''}}</textarea></label><label>Kind<select name="kind">{% for v in ['general','preparation','follow_up'] %}<option {% if note and note.kind==v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></label><label>Meeting<select name="commitment_id"><option value="">None</option>{% for x in commitments %}<option value="{{x.id}}" {% if note and note.commitment_id==x.id %}selected{% endif %}>{{x.title}}</option>{% endfor %}</select></label><label>Tasks<select multiple name="task_ids">{% for x in tasks %}<option value="{{x.id}}">{{x.title}}</option>{% endfor %}</select></label><label>Contacts<select multiple name="contact_ids">{% for x in contacts %}<option value="{{x.id}}">{{x.name}}</option>{% endfor %}</select></label><button>Save</button></form>{% endblock %}
