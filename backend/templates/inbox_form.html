{% extends 'base.html' %}{% block content %}<div class="mb-4"><p class="eyebrow mb-1">Quick capture</p><h1 class="h2 mb-0">{% if item %}Edit inbox item{% else %}What do you need to remember?{% endif %}</h1></div><section class="page-card"><form method="post"><label class="form-label" for="content">Capture</label><textarea class="form-control mb-3" id="content" name="content" rows="6" required placeholder="Write the thought, task, or reminder…">{{item.content if item else ''}}</textarea><button class="btn btn-primary">{% if item %}Save changes{% else %}Save to inbox{% endif %}</button></form></section>{% endblock %}
