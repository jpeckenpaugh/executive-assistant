{% extends 'base.html' %}{% block content %}<h1>Search</h1><form><input name="q" value="{{q}}" placeholder="Search"><select name="type"><option value="">All types</option>{% for v in ['task','commitment','contact','note','reminder','inbox'] %}<option {% if type==v %}selected{% endif %}>{{v}}</option>{% endfor %}</select><button>Search</button></form>{% if q %}<ul>{% for label,x,url in results %}<li><strong>{{label}}</strong>: <a href="{{url}}">{{x.title if x.title is defined else (x.name if x.name is defined else x.content)}}</a></li>{% else %}<li>No matching records.</li>{% endfor %}</ul>{% endif %}{% endblock %}
