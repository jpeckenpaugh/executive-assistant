{% extends 'base.html' %}{% block content %}<h1>Reminders</h1><a href="/reminders/new">New reminder</a><ul>{% for x in reminders %}<li>{{x.title}} — {{x.remind_at}} — {{x.status}} {% if x.is_sample %}(sample){% endif %}<form class="d-inline" method="post" action="/reminders/{{x.id}}/acknowledge"><button>Acknowledge</button></form><form class="d-inline" method="post" action="/reminders/{{x.id}}/dismiss"><button>Dismiss</button></form><form class="d-inline" method="post" action="/reminders/{{x.id}}/snooze"><input type="datetime-local" required name="remind_at"><button>Snooze</button></form></li>{% endfor %}</ul>{% endblock %}
