{% extends 'base.html' %}{% block content %}<h1>Commitments</h1><a href="/commitments/new">New commitment</a><ul>{% for x in commitments %}<li><a href="/commitments/{{x.id}}/edit">{{x.title}}</a> — {{x.starts_at}}, {{x.status}} {% if x.is_sample %}(sample){% endif %}<form class="d-inline" method="post" action="/commitments/{{x.id}}/cancel"><button>Cancel</button></form><form class="d-inline" method="post" action="/commitments/{{x.id}}/complete"><button>Complete</button></form></li>{% endfor %}</ul>{% endblock %}
