{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between align-items-end mb-4"><div><p class="eyebrow mb-1">Context</p><h1 class="h2 mb-0">Notes</h1></div><a class="btn btn-primary" href="/notes/new">New note</a></div><section class="page-card"><div class="record-list">{% for x in notes %}<div class="record-row"><a class="fw-semibold" href="/notes/{{x.id}}/edit">{{x.title or x.content[:60]}}</a><div class="record-meta">{{x.kind|replace('_',' ')|title}} · Updated {{x.updated_at.strftime('%b %-d')}}{% if x.is_sample %} · <span class="badge badge-sample">Sample</span>{% endif %}</div></div>{% else %}<p class="empty-state mb-0">No notes yet.</p>{% endfor %}</div></section>{% endblock %}
