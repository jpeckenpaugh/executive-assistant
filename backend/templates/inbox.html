{% extends 'base.html' %}{% block content %}<h1>Inbox</h1><a href="/inbox/new">Quick capture</a><ul>{% for x in items %}<li><a href="/inbox/{{x.id}}/edit">{{x.content}}</a> — {{x.status}}{% if x.status=='pending' %}<form method="post" action="/inbox/{{x.id}}/process"><select name="processed_type"><option>task</option><option>note</option><option>reminder</option></select><input name="title" placeholder="Optional title"><input type="datetime-local" name="remind_at"><button>Process</button></form><form method="post" action="/inbox/{{x.id}}/dismiss"><button>Dismiss</button></form>{% endif %}</li>{% endfor %}</ul>{% endblock %}
