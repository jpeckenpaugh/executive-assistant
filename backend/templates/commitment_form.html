{% extends 'base.html' %}{% block content %}<h1>{% if commitment %}Edit{% else %}New{% endif %} commitment</h1><form method="post"><label>Title<input name="title" required value="{{commitment.title if commitment else ''}}"></label><label>Kind<select name="kind"><option>meeting</option><option>other</option></select></label><label>Start<input type="datetime-local" name="starts_at" required value="{{commitment.starts_at.strftime('%Y-%m-%dT%H:%M') if commitment else ''}}"></label><label>Duration minutes<input type="number" min="1" name="duration_minutes" value="{{commitment.duration_minutes if commitment and commitment.duration_minutes else ''}}"></label><label>Location<input name="location" value="{{commitment.location if commitment else ''}}"></label><label>Attendees<input name="attendees" value="{{commitment.attendees if commitment else ''}}"></label><label>Notes<textarea name="notes">{{commitment.notes if commitment else ''}}</textarea></label><label>Contacts<select multiple name="contact_ids">{% for x in contacts %}<option value="{{x.id}}">{{x.name}}</option>{% endfor %}</select></label><label>Tasks<select multiple name="task_ids">{% for x in tasks %}<option value="{{x.id}}">{{x.title}}</option>{% endfor %}</select></label><button>Save</button></form>{% endblock %}
