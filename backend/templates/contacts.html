{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between align-items-end mb-4"><div><p class="eyebrow mb-1">People</p><h1 class="h2 mb-0">Contacts</h1></div><a class="btn btn-primary" href="/contacts/new">New contact</a></div><section class="page-card"><div class="record-list">{% for x in contacts %}<div class="record-row d-flex justify-content-between"><div><a class="fw-semibold" href="/contacts/{{x.id}}/edit">{{x.name}}</a><div class="record-meta">{{x.role}}{% if x.organization %} · {{x.organization}}{% endif %}{% if x.is_sample %} · <span class="badge badge-sample">Sample</span>{% endif %}</div></div><form method="post" action="/contacts/{{x.id}}/delete" onsubmit="return confirm('Delete this unlinked contact?');"><button class="btn btn-sm btn-outline-danger">Delete</button></form></div>{% else %}<p class="empty-state mb-0">No contacts yet.</p>{% endfor %}</div></section>{% endblock %}
