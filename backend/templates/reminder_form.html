{% extends 'base.html' %}{% block content %}<div class="mb-4"><p class="eyebrow mb-1">In-app alert</p><h1 class="h2 mb-0">New reminder</h1></div><section class="page-card"><form method="post" class="row g-3"><div class="col-12"><label class="form-label">Title</label><input class="form-control" name="title" required></div><div class="col-md-6"><label class="form-label">When</label><input class="form-control" type="datetime-local" name="remind_at" required></div><div class="col-md-6"><label class="form-label">Link to one record (optional)</label><select class="form-select" name="task_id"><option value="">No task</option>{% for x in tasks %}<option value="{{x.id}}">{{x.title}}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Or link to one commitment</label><select class="form-select" name="commitment_id"><option value="">No commitment</option>{% for x in commitments %}<option value="{{x.id}}">{{x.title}}</option>{% endfor %}</select></div><div><button class="btn btn-primary">Create reminder</button></div></form></section>{% endblock %}
