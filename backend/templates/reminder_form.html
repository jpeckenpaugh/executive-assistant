{% extends 'base.html' %}{% block content %}<h1>New reminder</h1><form method="post"><label>Title<input name="title" required></label><label>When<input type="datetime-local" name="remind_at" required></label><label>Task<select name="task_id"><option value="">None</option>{% for x in tasks %}<option value="{{x.id}}">{{x.title}}</option>{% endfor %}</select></label><label>Commitment<select name="commitment_id"><option value="">None</option>{% for x in commitments %}<option value="{{x.id}}">{{x.title}}</option>{% endfor %}</select></label><button>Save</button></form>{% endblock %}
