{% extends 'base.html' %}{% block content %}<h1>{% if task %}Edit{% else %}New{% endif %} task</h1><form method="post"><label>Title<input name="title" required value="{{task.title if task else ''}}"></label><label>Description<textarea name="description">{{task.description if task else ''}}</textarea></label><label>Priority<select name="priority">{% for v in ['low','medium','high'] %}<option {% if task and task.priority==v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></label><label>Due<input type="datetime-local" name="due_at" value="{{task.due_at.strftime('%Y-%m-%dT%H:%M') if task and task.due_at else ''}}"></label><label>Recurrence<select name="recurrence">{% for v in ['none','daily','weekly','monthly'] %}<option {% if task and task.recurrence==v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></label><label>Until<input type="datetime-local" name="recurrence_until" value="{{task.recurrence_until.strftime('%Y-%m-%dT%H:%M') if task and task.recurrence_until else ''}}"></label><label>Commitments<select multiple name="commitment_ids">{% for x in commitments %}<option value="{{x.id}}" {% if task and x in task.commitments %}selected{% endif %}>{{x.title}}</option>{% endfor %}</select></label><label>Contacts<select multiple name="contact_ids">{% for x in contacts %}<option value="{{x.id}}" {% if task and x in task.contacts %}selected{% endif %}>{{x.name}}</option>{% endfor %}</select></label><label>Notes<select multiple name="note_ids">{% for x in notes %}<option value="{{x.id}}" {% if task and x in task.notes %}selected{% endif %}>{{x.title}}</option>{% endfor %}</select></label><button>Save</button></form>{% endblock %}
