{% extends 'base.html' %}{% block content %}<h1>Tasks</h1><a href="/tasks/new">New task</a><form><select name="status"><option value="">All status</option><option value="open">Open</option><option value="completed">Completed</option></select><select name="priority"><option value="">All priorities</option><option>low</option><option>medium</option><option>high</option></select><button>Filter</button></form><ul>{% for x in tasks %}<li><a href="/tasks/{{x.id}}/edit">{{x.title}}</a> — {{x.priority}}, {{x.status}}, {{x.due_at}} {% if x.is_sample %}(sample){% endif %}<form class="d-inline" method="post" action="/tasks/{{x.id}}/complete"><button>Complete</button></form><form class="d-inline" method="post" action="/tasks/{{x.id}}/postpone"><input type="datetime-local" name="due_at" required><button>Postpone</button></form></li>{% else %}<li>No tasks</li>{% endfor %}</ul>{% endblock %}
